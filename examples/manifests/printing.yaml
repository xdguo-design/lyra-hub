schemaVersion: "1.0"
id: lyra-print
name: 智能打印
version: "0.3.0"
type: application
description: 独立打印平台
category: productivity
standalone:
  enabled: true
  url: http://127.0.0.1:5174
workspace:
  enabled: true
  path: /apps/printing
  integration:
    type: iframe
    url: http://127.0.0.1:5174
    allowedOrigins:
      - http://127.0.0.1:5174
navigation:
  title: 智能打印
  icon: printer
  order: 20
pages:
  - id: jobs
    title: 打印任务
    path: /jobs
    order: 10
    visible: true
  - id: devices
    title: 设备
    path: /devices
    order: 20
    visible: true
  - id: templates
    title: 模板
    path: /templates
    order: 30
    visible: true
capabilities:
  consumes:
    - agent.run
    - workflow.run
    - file.read
  provides:
    - print.execute
permissions:
  - printing.read
  - printing.operate
health:
  url: http://127.0.0.1:8080/health
  timeoutMs: 5000
