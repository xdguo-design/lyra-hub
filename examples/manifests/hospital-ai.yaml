schemaVersion: "1.0"
id: hospital-ai
name: 医院 AI
version: "0.1.0"
type: application
description: 医院业务 AI 应用入口
category: healthcare
standalone:
  enabled: true
  url: https://hospital-ai.example.com
workspace:
  enabled: true
  path: /apps/hospital-ai
  integration:
    type: iframe
    url: https://hospital-ai.example.com
    allowedOrigins:
      - https://hospital-ai.example.com
navigation:
  title: 医院 AI
  icon: medicine-box
  order: 30
pages:
  - id: outpatient
    title: 门诊
    path: /outpatient
    order: 10
    visible: true
  - id: charge
    title: 门诊收费
    path: /charge
    order: 20
    visible: true
  - id: assistant
    title: AI 助手
    path: /assistant
    order: 30
    visible: true
capabilities:
  consumes:
    - model.generate
    - agent.run
    - workflow.run
    - knowledge.search
permissions:
  - hospital-ai.read
