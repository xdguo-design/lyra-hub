schemaVersion: "1.0"
id: lyra-narrative
name: 小说工作台
version: "0.1.0"
type: application
description: 小说与内容创作业务应用
category: content
standalone:
  enabled: true
  url: http://127.0.0.1:8000
workspace:
  enabled: true
  path: /apps/narrative
  integration:
    type: iframe
    url: http://127.0.0.1:8000
    allowedOrigins:
      - http://127.0.0.1:8000
navigation:
  title: 小说工作台
  icon: book
  order: 10
pages:
  - id: writing
    title: 写作
    path: /writing
    order: 10
    visible: true
  - id: characters
    title: 人物
    path: /characters
    order: 20
    visible: true
  - id: world
    title: 世界观
    path: /world
    order: 30
    visible: true
  - id: reader
    title: Reader
    path: /reader
    order: 40
    visible: true
capabilities:
  consumes:
    - model.generate
    - agent.run
    - workflow.run
    - file.read
permissions:
  - narrative.read
  - narrative.write
health:
  url: http://127.0.0.1:8000/api/health
  timeoutMs: 5000
