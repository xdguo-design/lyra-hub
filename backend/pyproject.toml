[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-hub"
version = "0.1.0"
description = "Lyra AI application hub control plane"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141.0,<0.142.0",
  "uvicorn[standard]>=0.35.0,<0.36.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "sqlalchemy>=2.0.54,<2.1.0",
  "alembic>=1.16.0,<2.0.0",
  "httpx>=0.28.0,<0.29.0",
  "PyYAML>=6.0.2,<7.0.0",
  "jsonschema>=4.25.0,<5.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0,<9.0.0",
  "pytest-cov>=6.2.0,<7.0.0",
  "ruff>=0.13.0,<0.14.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# Tests import the editable top-level package name "app"; keep business code strict
# while avoiding environment-dependent isort classification in test collection.
[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["I001"]
